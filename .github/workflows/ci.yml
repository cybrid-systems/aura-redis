# aura-redis CI — build pinned Aura in official container, then smoke + ci-prod
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  AURA_BUILD_TYPE: RelWithDebInfo
  AURA_BUILD_JOBS: "0"
  AURA_CI: "1"
  AURA_USE_MOLD: "1"
  AURA_LINK_JOBS: "2"
  AURA_PIPELINE_STRICT: "0"
  CCACHE_DISABLE: "1"
  NINJA_STATUS: "[%f/%t %es] "
  AURA_REDIS_DENY_PLUGIN: "1"
  AURA_REDIS_SOAK_SEC: "30"

jobs:
  build-aura-and-smoke:
    name: build-aura + aura-redis-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - name: Checkout aura-redis
        uses: actions/checkout@v4

      - name: Orchestra baseline drift (#13)
        run: python3 scripts/check-baseline.py

      - name: Install the pinned Aura nightly
        run: ./scripts/install-aura.sh

      - name: aura-redis smoke (PING/SET/GET/DEL/INCR/EXISTS/FLUSHDB)
        run: ./scripts/smoke-test.sh

  ci-prod:
    name: ci-prod (P0–P3 + strong)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: build-aura-and-smoke
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - name: Checkout aura-redis
        uses: actions/checkout@v4

      - name: Install the pinned Aura nightly
        run: ./scripts/install-aura.sh

      - name: ci-prod gate
        run: |
          export AURA_REDIS_SOAK_SEC="${AURA_REDIS_SOAK_SEC:-30}"
          ./scripts/ci-prod.sh
