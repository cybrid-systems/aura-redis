; Example stunnel front for aura-redis when native OpenSSL build is unavailable.
; Prefer native --tls-port (docs/tls.md). policy_agent can still hit cleartext 6379.
;
;   stunnel scripts/tls-stunnel-example.conf
;
foreground = yes
pid =

[aura-redis-tls]
accept = 6380
connect = 127.0.0.1:6379
cert = /path/to/cert.pem
key = /path/to/key.pem
